apiVersion: v1
kind: Service
metadata:
  name: "{{ .Chart.Name }}-headless-svc"
  labels:
{{ include "postgres.labels" . | indent 4 }}
spec:
  {{- with .Values.service }}
  type: {{ .type }}
  clusterIP: None
  ports:
    {{- with .port }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
    {{- end }}
  {{- end }}
  selector:
{{- include "postgres.selectorLabels" . | nindent 4 }}