service:
  type: NodePort
  port:
    port: 80
    targetPort: 8080

secret:
  connection-string: ref+vault://secrets/back#/connection-string

deployment:
  replicas: 3
  image:
    name: bahlish/film-match
    tag: "1.6"
    pullPolicy: Always
  env:
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_URLS: http://+:8080
    ConnectionStrings__DefaultConnection: ref+vault://secrets/back#/connection-string
  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 15
    periodSeconds: 60
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
