apiVersion: v1
kind: Service
metadata:
  name: "{{ .Chart.Name }}-headless-svc"
spec:
  {{- with .Values.service }}
  type: {{ .type }}
  clusterIP: None
  ports:
    {{- with .port }}
    - name: {{ .name }}
      port: {{ .port }}
      targetPort: {{ .targetPort }}
      protocol: {{ .protocol }}
    {{- end }}
  {{- end }}
  selector:
    app: {{ $.Chart.Name }}
